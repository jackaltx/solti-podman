---
name: CI

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linters
        run: |
          pip install ansible-lint ansible-core yamllint
          npm install -g markdownlint-cli

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Run yamllint
        run: |
          # Levels controlled by .yamllint config — no --strict override
          # molecule/shared/ diagnostic files excluded in .yamllint ignore
          yamllint . || echo "yamllint warnings found (see .yamllint for levels)"

      - name: Run ansible-lint
        # Advisory — strict enforcement is a Galaxy publish gate, not a PR gate.
        # Incremental cleanup tracked via /lint-fix; ~1800 pre-existing errors.
        run: ansible-lint || echo "ansible-lint warnings (not blocking)"

      - name: Run markdownlint
        # Advisory only — MD formatting does not block CI
        run: markdownlint "**/*.md" --ignore node_modules --config .markdownlintrc || echo "markdownlint advisory (not blocking)"
