---
name: CI

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install linters
        run: |
          pip install ansible-lint ansible-core yamllint
          npm install -g markdownlint-cli

      - name: "[TEST] Deliberate failure to test analyze-failure.yml — REVERT THIS"
        run: |
          echo "Simulating a CI failure to test Claude analysis workflow"
          echo "This step will be removed immediately after the test"
          exit 1

      - name: Run yamllint
        run: |
          # Levels controlled by .yamllint config — no --strict override
          # molecule/shared/ diagnostic files excluded in .yamllint ignore
          yamllint . || echo "yamllint warnings found (see .yamllint for levels)"

      - name: Run ansible-lint
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]] || [[ "${{ github.base_ref }}" == "main" ]]; then
            ansible-lint --strict
          else
            ansible-lint || echo "Warnings allowed on test branch"
          fi

      - name: Run markdownlint
        # Advisory only — MD formatting does not block CI
        run: markdownlint "**/*.md" --ignore node_modules --config .markdownlintrc || echo "markdownlint advisory (not blocking)"
